name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          version="$(scripts/release-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag is already published."
            exit 1
          fi

          scripts/release-notes.sh stable "$VERSION" > "$RUNNER_TEMP/notes.md"

          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          elif [ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]; then
            echo "::error::$tag already exists on a different commit."
            exit 1
          fi

          gh release create "$tag" artifacts/*.zip \
            --verify-tag --target main --latest \
            --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"

          target="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .target_commitish)"
          if [ "$target" != "main" ]; then
            echo "::error::Release target is '$target', so Lidarr will not find it."
            exit 1
          fi
